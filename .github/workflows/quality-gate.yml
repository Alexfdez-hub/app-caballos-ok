name: Quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: App quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auth unit tests
        run: npm run test:auth

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Whitespace check
        run: |
          git diff --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git diff --check "${{ github.event.pull_request.base.sha }}"
          else
            git fetch --no-tags origin main
            git diff --check origin/main
          fi

      - name: Inherited migrations unchanged versus PR base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags origin "$BASE_SHA"
          else
            git fetch --no-tags origin main
            BASE_SHA="$(git rev-parse origin/main)"
          fi
          echo "Comparing inherited migrations against $BASE_SHA"
          changed=0
          while IFS=$'\t' read -r status path extra; do
            [ -z "${status:-}" ] && continue
            case "$status" in
              A)
                echo "New migration allowed: $path"
                ;;
              M|D|T|U)
                echo "Inherited migration must not be $status: $path"
                changed=1
                ;;
              R*)
                echo "Inherited migration must not be renamed: $path -> ${extra:-}"
                changed=1
                ;;
              C*)
                echo "Inherited migration must not be copied as a replacement: $path"
                changed=1
                ;;
              *)
                echo "Unexpected migration diff status $status for $path"
                changed=1
                ;;
            esac
          done < <(git diff --name-status -M "$BASE_SHA" -- supabase/migrations)
          if [ "$changed" -ne 0 ]; then
            echo "A migration that already existed at the PR base was modified, deleted, or renamed."
            exit 1
          fi
          while IFS= read -r inherited; do
            [ -z "$inherited" ] && continue
            if [ ! -f "$inherited" ]; then
              echo "Inherited migration missing from HEAD: $inherited"
              exit 1
            fi
            git diff --exit-code "$BASE_SHA" -- "$inherited"
          done < <(git ls-tree -r --name-only "$BASE_SHA" -- supabase/migrations)
          echo "Inherited migrations unchanged; new migration files are allowed."

  postgres-quality:
    name: PostgreSQL quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx --yes supabase@2.116.0 start --yes --ignore-health-check -x studio,imgproxy

      - name: Reset local database
        run: npx --yes supabase@2.116.0 db reset --local --yes

      - name: SQL suites
        run: npm run test:sql

      - name: Diagnose local Docker
        if: failure()
        run: |
          echo "docker ps"
          docker ps -a || true
          echo "container logs (tail, credentials filtered)"
          docker ps -aq | while read -r id; do
            name="$(docker inspect -f '{{.Name}}' "$id" 2>/dev/null || echo "$id")"
            echo "===== logs: $name ====="
            docker logs --tail 80 "$id" 2>&1 | sed -E \
              '/SERVICE_ROLE|service_role|SECRET|secret|PASSWORD|password|passwd|anon[_-]?key|JWT_SECRET|JWT|API_KEY|api[_-]?key|Bearer |postgres:\/\/|postgresql:\/\/|DATABASE_URL|DB_URL|DB_PASSWORD|AWS_|S3_|s3:\/\/|SUPABASE_ACCESS|linked project|project_ref|eyJ[A-Za-z0-9_-]{10,}/d' \
              || true
          done

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.116.0 stop --no-backup --yes
